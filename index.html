<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Magic Particle</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: radial-gradient(circle at center, #0b1a3a, #020611);
}
canvas {
  display: block;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let particles = [];
let mouse = { x: 0, y: 0 };

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// マウス操作
window.addEventListener("mousemove", (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  for (let i = 0; i < 4; i++) createParticle(mouse.x, mouse.y);
});

// タッチ対応（スマホOK）
window.addEventListener("touchmove", (e) => {
  const touch = e.touches[0];
  mouse.x = touch.clientX;
  mouse.y = touch.clientY;
  for (let i = 0; i < 6; i++) createParticle(mouse.x, mouse.y);
});

function createParticle(x, y) {
  const size = Math.random() * 3 + 1;
  const speedX = (Math.random() - 0.5) * 1.5;
  const speedY = (Math.random() - 0.5) * 1.5 - 0.5;
  const life = Math.random() * 60 + 60;

  particles.push({
    x,
    y,
    size,
    speedX,
    speedY,
    life,
    maxLife: life,
    opacity: 1
  });
}

function drawParticle(p) {
  const gradient = ctx.createRadialGradient(
    p.x, p.y, 0,
    p.x, p.y, p.size * 3
  );

  gradient.addColorStop(0, `rgba(255, 215, 100, ${p.opacity})`);
  gradient.addColorStop(0.5, `rgba(255, 200, 80, ${p.opacity * 0.6})`);
  gradient.addColorStop(1, `rgba(255, 180, 50, 0)`);

  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
  ctx.fill();
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.speedX;
    p.y += p.speedY;

    p.life--;
    p.opacity = p.life / p.maxLife;

    p.speedY -= 0.01;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function animate() {
  ctx.fillStyle = "rgba(2, 6, 17, 0.3)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  updateParticles();
  particles.forEach(drawParticle);

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
